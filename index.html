      <h1>Barkantedjo — Humoriste camerounais, « le béni »</h1>
      <p>
        Barkantedjo, de son vrai nom Mohamed Ali, est un humoriste, content creator et
        digital marketer camerounais né à Ngaoundéré (Adamaoua). Son nom signifie « le béni »
        en Fulfulde. Pionnier de l'humour Fulfulde en format vertical, il réunit plus de
        640 000 abonnés (« Les Barkantéens ») sur TikTok, Facebook et YouTube.
      </p>
      <p>
        En 2026, sa première tournée internationale, The Explorer Tour, traverse cinq villes
        du Nigeria : Yola, Gombe, Kano, Kaduna et Abuja.
